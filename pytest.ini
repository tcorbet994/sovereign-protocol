[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    --verbose
    --cov=sovereign_control
    --cov-report=term-missing
    --cov-report=html
    --benchmark-only
    --benchmark-group-by=func
    --benchmark-warmup=on
    --benchmark-warmup-iterations=5
    --benchmark-min-rounds=10
    --benchmark-skip
    --benchmark-json=benchmark-results.json
    --benchmark-compare
    --benchmark-compare-fail=min:5%:max:10%
    --benchmark-autosave
    --benchmark-histogram=benchmark-histogram.png
    --benchmark-timer=time.perf_counter
    --benchmark-warmup=on
    --benchmark-warmup-iterations=5
    --benchmark-min-rounds=10
    --benchmark-skip
    --benchmark-json=benchmark-results.json
    --benchmark-compare
    --benchmark-compare-fail=min:5%:max:10%
