name: Security Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0'  # Run weekly

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.8'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety checkov semgrep
        
    - name: Run Bandit
      run: |
        bandit -r sovereign_control/ -c pyproject.toml
        
    - name: Check dependencies for known vulnerabilities
      run: |
        safety check
        
    - name: Run Snyk security scan
      uses: snyk/actions/python@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --severity-threshold=high
        
    - name: Run dependency check
      run: |
        pip install pip-audit
        pip-audit
        
    - name: Check for secrets in code
      uses: gitleaks/gitleaks-action@v1.0.0
        
    - name: Run OWASP ZAP scan
      uses: zaproxy/action-full-scan@v0.4.0
      with:
        target: http://localhost:8000
        rules_file_name: '.zap/rules.tsv'
        cmd_options: '-a'
        
    - name: Run Semgrep scan
      uses: returntocorp/semgrep-action@v1
      with:
        config: p/python
        
    - name: Run Checkov for infrastructure security
      run: |
        checkov -d .
        
    - name: Run dependency graph check
      run: |
        pip install pip-tools
        pip-compile --output-file=requirements.txt pyproject.toml
        pip-compile --output-file=requirements-dev.txt pyproject.toml --extra=dev
        
    - name: Run license compliance check
      run: |
        pip install licensecheck
        licensecheck
        
    - name: Run code signing verification
      run: |
        pip install sigstore
        sigstore verify . 